          title: Sergii Arkhypov
          subtitle: "Sergii Arkhypov began his career as an ALM Analyst at Erste Bank, managing banking book risks, before moving into trading system development and integration across several financial institutions. He subsequently served as a Desk Quant for equity exotic derivatives and structured products at Credit Suisse, and later as a Manager and Quantitative Developer at EY, leading counterparty credit risk and regulatory change programs. Following a role as a Cross-Product Quantitative Analyst at BNP Paribas, Sergii moved into Valuation Model Risk, where he currently focuses on pricing model validation across IRFX and Credit perimeters. He holds a Master’s degree in Applied Mathematics from Kyiv Polytechnic Institute, a Master’s degree in Data Analytics and AI from Birkbeck, University of London, and an advanced certification in risk management (FRM)."
